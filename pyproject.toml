[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rank-lab"
version = "0.2.1"
description = "Resumable retrieval training with pinned inputs and inspectable ranking comparisons"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "pyarrow==21.0.0",
  "transformers==4.57.6",
  "torch==2.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.17"]

[project.scripts]
rank-lab = "rank_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rank_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
